# Deploy automático na Hostinger: push na main que mexe em server/ → portão verde → no ar.
# Também roda à mão (Actions → deploy → Run workflow), com opção de só simular.
# Segredos (Settings → Secrets and variables → Actions):
#   HOSTINGER_SSH_KEY, HOSTINGER_SSH (usuario@ip), HOSTINGER_PORT (65002), HOSTINGER_PATH, BE_URL
#   Banco (vão para o server/.env do servidor): BE_DB_NAME, BE_DB_USER, BE_DB_PASS
name: deploy

on:
  push:
    branches: [main]
    paths: ["server/**"]
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (mostra o que mudaria)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  hostinger:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: chave SSH
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Falta o segredo HOSTINGER_SSH_KEY (veja docs/CONFIGURAR.md)"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - name: publicar
        env:
          HOSTINGER_SSH: ${{ secrets.HOSTINGER_SSH || vars.HOSTINGER_SSH }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || vars.HOSTINGER_PORT }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH || vars.HOSTINGER_PATH }}
          BE_URL: ${{ secrets.BE_URL || vars.BE_URL }}
          BE_DB_NAME: ${{ secrets.BE_DB_NAME || vars.BE_DB_NAME }}
          BE_DB_USER: ${{ secrets.BE_DB_USER || vars.BE_DB_USER }}
          BE_DB_PASS: ${{ secrets.BE_DB_PASS }}
          # impressão digital ED25519 do servidor da Hostinger (pública; a mesma do WashEasy e do Portaria Express)
          HOSTINGER_HOST_FP: SHA256:w/VA0zi7P3KePP56aftdPRWQy9tc4LLl1p+lyvhx9TM
        run: scripts/deploy-hostinger.sh ${{ inputs.simular && '--simular' || '' }}
