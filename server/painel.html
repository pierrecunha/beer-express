<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#100D09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Beer Express • Painel</title>
<link rel="preload" href="fontes/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontes/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<script>/* tema antes de pintar (automático, claro ou escuro) */
(function(){try{var t=localStorage.getItem('be_tema');if(t==='claro'||t==='escuro')document.documentElement.dataset.theme=t==='escuro'?'dark':'light'}catch(e){}})();</script>
<style>
/* ═══ Beer Express — painel pelo celular (mesma estrutura do app WashEasy: topo, abas embaixo, folhas que sobem) ═══ */
@font-face{font-family:'Figtree';src:url(fontes/figtree.woff2) format('woff2');font-weight:300 900;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url(fontes/bricolage.woff2) format('woff2');font-weight:200 800;font-stretch:75% 100%;font-display:swap}
/* Claro "espuma" e escuro "barril". Destaque âmbar = cor do chopp. Verde/vermelho/amarelo só para ok, problema e atenção. */
:root{
  --bg:#F6F1E7;--card:#FFFFFF;--card2:#FAF6EE;--card3:#EFE7D8;--card4:#DCCFB7;
  --line:rgba(58,40,10,.09);--line2:rgba(58,40,10,.16);
  --tx:#4A3A22;--h:#2A1D08;--mut:#7A6646;--dim:#97845F;
  --g:#B26A00;--gg:rgba(178,106,0,.1);--g3:rgba(178,106,0,.35);--beer:#F5B301;
  --ok:#0B8A56;--okbg:rgba(11,138,86,.1);--bad:#C2372D;--badbg:rgba(194,55,45,.09);--warn:#9A6200;--warnbg:rgba(214,150,20,.14);
  --onacc:#FFFFFF;--glass:rgba(246,241,231,.88);--scrim:rgba(42,29,8,.42);
  --r:16px;--r2:13px;--sh:0 12px 32px rgba(42,29,8,.18);
  --fh:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
:root[data-theme=dark]{
  --bg:#100D09;--card:#1A1610;--card2:#221D15;--card3:#2C251B;--card4:#41372A;
  --line:rgba(255,240,210,.07);--line2:rgba(255,240,210,.13);
  --tx:#E3D6C0;--h:#FBF3E4;--mut:#B3A184;--dim:#8C7B60;
  --g:#F5B301;--gg:rgba(245,179,1,.12);--g3:rgba(245,179,1,.4);
  --ok:#3FCB88;--okbg:rgba(63,203,136,.12);--bad:#F28379;--badbg:rgba(242,131,121,.11);--warn:#F2B544;--warnbg:rgba(242,181,68,.13);
  --onacc:#1B1404;--glass:rgba(16,13,9,.86);--scrim:rgba(0,0,0,.62);--sh:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#100D09;--card:#1A1610;--card2:#221D15;--card3:#2C251B;--card4:#41372A;
  --line:rgba(255,240,210,.07);--line2:rgba(255,240,210,.13);
  --tx:#E3D6C0;--h:#FBF3E4;--mut:#B3A184;--dim:#8C7B60;
  --g:#F5B301;--gg:rgba(245,179,1,.12);--g3:rgba(245,179,1,.4);
  --ok:#3FCB88;--okbg:rgba(63,203,136,.12);--bad:#F28379;--badbg:rgba(242,131,121,.11);--warn:#F2B544;--warnbg:rgba(242,181,68,.13);
  --onacc:#1B1404;--glass:rgba(16,13,9,.86);--scrim:rgba(0,0,0,.62);--sh:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.no-tabs{padding-bottom:24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--g)}
:focus-visible{outline:2.5px solid var(--g);outline-offset:2px;border-radius:10px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}
.money{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r{text-align:right}.nw{white-space:nowrap}
/* topo */
.top{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.top .wrap{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--fh);font-weight:800;font-size:18px;color:var(--h);letter-spacing:-.4px;flex-shrink:0}
.brand b{color:var(--g);font-weight:800}
.pill{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line2);color:var(--h);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;min-height:42px;flex:1 1 auto;min-width:0}
.pill svg{width:18px;height:18px;color:var(--g)}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.sq{width:42px;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);color:var(--tx);display:grid;place-items:center;flex-shrink:0;font-weight:800;font-family:var(--fh)}
@media(max-width:400px){.brand .bt{display:none}}
/* títulos */
.ph1{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.ph1 h1{font-family:var(--fh);font-size:24px;font-weight:700;color:var(--h);letter-spacing:-.5px;flex:1;line-height:1.15}
.ph1 p{font-size:14px;color:var(--mut);font-family:var(--fb);font-weight:500;letter-spacing:0}
.sech{font-family:var(--fh);font-size:16px;font-weight:700;color:var(--h);margin:24px 2px 10px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.sech .mut{font-family:var(--fb);font-size:13px;font-weight:600;margin-left:auto}
/* blocos */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.box+.box{margin-top:12px}
.box h2{font-family:var(--fh);color:var(--h);font-size:17px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;background:var(--card3);color:var(--tx);font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.acc{background:var(--gg);color:var(--g)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okbg);flex-shrink:0;display:inline-block}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px var(--badbg)}
/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:96px}
.kpi .l{font-size:13px;color:var(--mut);font-weight:600}
.kpi .v{font-family:var(--fh);font-size:clamp(21px,6vw,28px);font-weight:700;color:var(--h);margin-top:6px;line-height:1.05;white-space:nowrap;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--mut);margin-top:5px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}
.bars div{flex:1;background:var(--g);opacity:.85;border-radius:4px 4px 1px 1px;min-height:2px;position:relative}
.bars.h div{background:var(--card4);opacity:1}
.meter{height:8px;border-radius:5px;background:var(--card3);overflow:hidden}.meter i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.meter i.low{background:var(--bad)}.meter i.mid{background:var(--warn)}
/* itens de lista */
.it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px;margin-bottom:8px;color:var(--tx);text-decoration:none}
button.it:hover,a.it:hover{border-color:var(--g3)}
.it .t{font-weight:700;color:var(--h)}
.it .s{font-size:13.5px;color:var(--mut)}
.it .grow{flex:1;min-width:0}
.it .grow>*{overflow:hidden;text-overflow:ellipsis}
.it .ic{width:40px;height:40px;border-radius:12px;background:var(--gg);color:var(--g);display:grid;place-items:center;flex-shrink:0;font-size:19px}
.it .pr{font-family:var(--fh);font-weight:700;font-size:17px;color:var(--h);white-space:nowrap;font-variant-numeric:tabular-nums}
.it>svg{color:var(--dim)}
.lrow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;align-items:center}
.lrow:last-child{border-bottom:0}
.lrow b{color:var(--h)}
.empty{text-align:center;color:var(--mut);padding:34px 16px}
.empty .e{font-size:40px;margin-bottom:8px}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;min-height:48px;text-decoration:none;white-space:nowrap;transition:opacity .15s,border-color .15s}
.btn svg{width:18px;height:18px}
.btn.w{background:var(--g);color:var(--onacc)}
.btn.o{background:var(--card2);border:1px solid var(--line2);color:var(--h)}
.btn.o:hover{border-color:var(--g3)}
.btn.d{background:var(--badbg);color:var(--bad)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:wait}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* segmentado */
.seg{display:flex;background:var(--card3);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:9px 12px;min-height:40px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--mut);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);color:var(--h);box-shadow:0 1px 3px var(--line2)}
.search{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;color:var(--h);outline:none;font-size:16px}
.search:focus{border-color:var(--g)}
/* abas embaixo (celular) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;border-radius:12px;color:var(--mut);font-size:12px;font-weight:700;position:relative}
.tab[aria-current=page]{color:var(--g)}
.tab[aria-current=page]::before{content:'';position:absolute;top:-6px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--g)}
.tab.star svg{width:25px;height:25px}
/* barra lateral (computador) */
.side{display:none}
@media(min-width:1024px){
  body,body.no-tabs{padding:0 0 32px 248px}
  .tabs{display:none!important}
  .side{display:flex;flex-direction:column;gap:2px;position:fixed;left:0;top:0;bottom:0;width:248px;z-index:35;background:var(--card);border-right:1px solid var(--line);padding:18px 12px}
  .side .brand{font-size:21px;padding:4px 10px 18px}
  .side button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--mut);font-weight:700;text-align:left}
  .side button:hover{background:var(--card2);color:var(--h)}
  .side button[aria-current=page]{background:var(--gg);color:var(--g)}
  .side .foot{margin-top:auto;font-size:13px;color:var(--mut);padding:10px 12px}
  .top .brand{display:none}
  .wrap{max-width:1080px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start}
  .cols2>.box+.box{margin-top:0}
}
/* folha que sobe (celular) / janela (computador) */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:60;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;padding:6px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet:not(.on){visibility:hidden;transition:transform .24s,visibility 0s .24s}
.sheet.full{top:0;max-height:none;border-radius:0;padding-top:calc(6px + env(safe-area-inset-top))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--card4);margin:6px auto 12px}
.sheet.full .grab{display:none}
.sheet h2.st{font-family:var(--fh);font-size:21px;letter-spacing:-.3px;font-weight:700;color:var(--h);margin:6px 0 14px;display:flex;align-items:center;gap:10px}
.sheet h2.st small{display:block;font-family:var(--fb);font-size:13px;color:var(--mut);font-weight:600;letter-spacing:0}
.x{margin-left:auto;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line2);color:var(--tx);flex-shrink:0}
@media(min-width:760px){
  .sheet,.sheet.full{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,calc(100vw - 48px));max-height:88vh;border-radius:20px;border-bottom:1px solid var(--line2);transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;padding-top:6px}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
}
.sbar{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom));margin:16px -18px calc(-22px - env(safe-area-inset-bottom));padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;z-index:2}
.sbar .btn{flex:1}
/* formulários */
.field{display:block;margin-bottom:14px;min-width:0}
.field>span{display:block;font-size:14px;color:var(--h);margin-bottom:6px;font-weight:700}
.field>span small{color:var(--mut);font-weight:500}
.field input,.field select,.field textarea{width:100%;min-width:0;-webkit-appearance:none;appearance:none;background:var(--card2);border:1px solid var(--line2);border-radius:11px;padding:12px 13px;color:var(--h);outline:none;min-height:48px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.field input[type=color]{padding:4px;height:48px}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--gg)}
.field .help{font-size:13px;color:var(--mut);margin-top:5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:420px){.fgrid.r1{grid-template-columns:1fr}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14.5px;color:var(--tx);min-height:42px}
.opts button[aria-pressed=true]{background:var(--gg);border-color:var(--g);color:var(--g)}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line2)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--g)}
.step{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.step button{width:52px;height:50px;font-size:24px;font-weight:700;color:var(--g)}
.step input{flex:1;border:0!important;background:transparent!important;text-align:center;font-family:var(--fh);font-size:22px!important;font-weight:700;min-width:0;box-shadow:none!important;padding:0!important}
.step em{font-style:normal;color:var(--mut);font-weight:700;padding-right:12px}
.tg{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.tg .grow{flex:1}.tg b{color:var(--h);display:block}.tg small{color:var(--mut)}
.tg input{display:none}
.tg i{width:48px;height:28px;border-radius:14px;background:var(--card4);position:relative;flex-shrink:0;transition:background .15s}
.tg i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px #0003}
.tg input:checked+i{background:var(--ok)}.tg input:checked+i::after{left:23px}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:14px}
.note.info{background:var(--gg);color:var(--g)}
/* ═══ Bebidas ═══ */
.taps{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.taps{grid-template-columns:1fr 1fr}}
.tapc{display:grid;grid-template-columns:92px 1fr;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;color:var(--tx);position:relative;width:100%}
.tapc:hover{border-color:var(--g3)}
.tapc .ft{width:92px;height:112px;border-radius:13px;background:linear-gradient(160deg,var(--card3),var(--card2));display:grid;place-items:center;overflow:hidden;position:relative}
.tapc .ft img{width:100%;height:100%;object-fit:cover}
.tapc .num{position:absolute;left:6px;top:6px;background:#000a;color:#fff;font-family:var(--fh);font-weight:800;font-size:12px;border-radius:7px;padding:1px 7px}
.tapc h3{font-family:var(--fh);font-size:18px;color:var(--h);line-height:1.15;letter-spacing:-.3px;font-weight:700}
.tapc .s{font-size:13px;color:var(--mut);margin-top:2px}
.tapc .szs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tapc .szs span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:700;color:var(--h);white-space:nowrap}
.tapc .kg{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:var(--mut);font-weight:600}
.tapc .kg .meter{flex:1;height:6px}
.tapc .ed{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:10px;background:var(--gg);color:var(--g);display:grid;place-items:center}
.tapc .ed svg{width:17px;height:17px}
.tapc.off{opacity:.6}
.cup{width:48px;height:62px;border-radius:7px 7px 13px 13px;background:linear-gradient(180deg,#ffffffcc 0 17%,var(--c,#F5B301) 17% 100%);box-shadow:inset 0 -10px 18px #0003,0 0 0 2px #fff6}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:39;background:var(--g);color:var(--onacc);border-radius:16px;padding:0 18px;height:54px;display:flex;align-items:center;gap:8px;font-weight:800;box-shadow:var(--sh)}
@media(min-width:1024px){.fab{bottom:28px;right:28px}}
/* editor de bebida */
.prev{background:#120E08;border-radius:18px;padding:14px;color:#F7EFE2;display:grid;grid-template-columns:1fr 110px;gap:12px;margin-bottom:16px;position:relative;overflow:hidden;font-family:system-ui,sans-serif}
.prev .tn{font-size:28px;font-weight:900;color:#F5B301;line-height:1}
.prev h4{font-size:17px;font-weight:900;line-height:1.1;margin-top:6px;word-break:break-word}
.prev .cv{font-size:11px;color:#A9987E;letter-spacing:.06em;margin-top:2px}
.prev .inf{font-size:11px;color:#A9987E;margin-top:10px;line-height:1.5}.prev .inf b{display:block;color:#F7EFE2;font-size:13px}
.prev .im{height:150px;border-radius:12px;background:#000;display:grid;place-items:center;overflow:hidden}
.prev .im img{width:100%;height:100%;object-fit:cover}
.prev .val{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #ffffff1a;padding-top:10px}
.prev .val b{font-size:22px;color:#F5B301;white-space:nowrap}.prev .val>span{flex-shrink:0;padding-left:10px}.prev .val small{font-size:11px;color:#A9987E}
.prev .lbl{grid-column:1/-1;margin:-4px 0 -6px;font-size:10px;font-weight:800;letter-spacing:.08em;color:#A9987E}
.fotob{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;margin-bottom:16px}
.fotob .pv{width:96px;height:96px;border-radius:14px;background:var(--card3);display:grid;place-items:center;overflow:hidden}
.fotob .pv img{width:100%;height:100%;object-fit:cover}
.fotob .acts .btn{flex:1}
.szr{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:start;margin-bottom:8px}
.szr .in{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line2);border-radius:11px;padding:0 12px;min-height:50px}
.szr .in input{border:0;background:transparent;outline:none;width:100%;min-width:0;font-size:17px;font-weight:700;color:var(--h);padding:12px 0}
.szr .in em{font-style:normal;color:var(--mut);font-weight:700;font-size:14px}
.szr .del{height:50px;border-radius:11px;background:var(--badbg);color:var(--bad);display:grid;place-items:center}
.szr .hint{grid-column:1/-1;font-size:12.5px;color:var(--mut);margin:-2px 2px 4px}
.lib{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.lib .ft{width:56px;height:56px;border-radius:12px;background:var(--card3);display:grid;place-items:center;overflow:hidden}
.lib .ft img{width:100%;height:100%;object-fit:cover}.lib .cup{width:30px;height:38px}
details.adv{border:1px solid var(--line2);border-radius:12px;padding:0 14px;margin-bottom:14px}
details.adv summary{padding:13px 0;font-weight:700;color:var(--h);cursor:pointer}
/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:90;background:var(--h);color:var(--bg);border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;box-shadow:var(--sh);display:none;text-align:center;max-width:520px;margin:0 auto}
.toast.on{display:block;animation:tin .25s ease}.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media(min-width:1024px){.toast{left:auto;right:28px;bottom:28px;width:420px}}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{width:100%;max-width:380px;padding:34px 26px;border-radius:20px}
.login h1{font-family:var(--fh);font-size:32px;font-weight:800;color:var(--h);text-align:center;letter-spacing:-1px}
.login h1 b{color:var(--g)}
.login p.s{text-align:center;color:var(--mut);margin:4px 0 22px}
.hub{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.hub button,.hub a{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;min-height:62px;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none}
.hub>*:last-child{border-bottom:0}
.hub .ic{width:38px;height:38px;border-radius:11px;background:var(--gg);color:var(--g);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.hub b{display:block;color:var(--h)}.hub small{color:var(--mut);font-size:13px}
.hub .grow{flex:1;min-width:0}
code{background:var(--card3);padding:2px 6px;border-radius:6px;font-size:12.5px;word-break:break-all;color:var(--h)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:700}
.tw{overflow-x:auto}
</style>
</head>

<div id="root"></div>
<div class="sheet-bg" id="sheetBg" onclick="closeM()"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const API='api.php';
let JWT=localStorage.getItem('be_jwt')||'', ME=null, CAT=null, SET=null, BEB=null, PAGE='bebidas', TIMER=null, PONTOS=[];
let PONTO=localStorage.getItem('be_ponto')||'';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const brl=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>String(v??'').replace('.',',');
const mlf=ml=>(ml=+ml||0)>=1000?(ml/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' L':ml+' ml';
const dt=s=>s?new Date(s.replace(' ','T')).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const ago=s=>{if(!s)return 'nunca';const m=Math.round((Date.now()-new Date(s.replace(' ','T')))/60000);return m<1?'agora':m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' d'};
const hoje=(d=0)=>{const x=new Date(Date.now()-d*864e5);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const ADMIN=()=>ME&&ME.role!=='dono';
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast on'+(bad?' bad':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3600)}
function openM(h,full){const s=$('#sheet');s.className='sheet'+(full?' full':'');s.innerHTML='<div class="grab"></div>'+h;s.scrollTop=0;$('#sheetBg').classList.add('on');requestAnimationFrame(()=>s.classList.add('on'));document.body.style.overflow='hidden'}
function closeM(){$('#sheet').classList.remove('on');$('#sheetBg').classList.remove('on');document.body.style.overflow=''}
const sh=(t,sub)=>`<h2 class="st"><span>${t}${sub?`<small>${sub}</small>`:''}</span><button class="x" onclick="closeM()" aria-label="Fechar">${ic('x')}</button></h2>`;
async function api(r,body){const res=await fetch(API+'?r='+r,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+JWT},body:body?JSON.stringify(body):undefined});
  const j=await res.json().catch(()=>({ok:false,mensagem:'Erro de comunicação com o servidor'}));
  if(res.status===401&&j.erro==='auth'){JWT='';localStorage.removeItem('be_jwt');login();throw j}
  if(!j.ok)throw j;return j}
const ST={aguardando_pagamento:['Aguardando',''],pago:['Pago','acc'],servindo:['Servindo','acc'],concluido:['Concluído','ok'],parcial:['Parcial','warn'],falhou:['Falhou','bad'],cancelado:['Cancelado',''],estornado:['Estornado','warn'],
  pendente:['Na fila',''],armado:['Aguardando cliente','acc'],liberado:['Liberado','acc'],timeout:['Tempo esgotado','warn'],erro:['Erro','bad']};
const pill=s=>{const[t,c]=ST[s]||[s,''];return `<span class="chip ${c}">${t}</span>`};
const met=m=>({credito:'💳 Crédito',debito:'💳 Débito',pix:'⚡ Pix'})[m]||'—';

/* ════════ login ════════ */
async function login(){document.body.className='no-tabs';
  const s=await fetch(API+'?r=admin/needs_setup').then(r=>r.json()).catch(()=>({}));
  $('#root').innerHTML=`<div class="login"><div class="box"><div style="font-size:46px;text-align:center">🍺</div><h1>Beer <b>Express</b></h1><p class="s">${s.needs_setup?'Crie o usuário administrador':'Painel do seu quiosque de chopp'}</p>
   ${s.needs_setup?'<label class="field"><span>Seu nome</span><input id="ln" autocomplete="name"></label>':''}
   <label class="field"><span>E-mail</span><input id="le" type="email" autocomplete="username" inputmode="email"></label>
   <label class="field"><span>Senha</span><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin(${!!s.needs_setup})"></label>
   <button class="btn w full" onclick="doLogin(${!!s.needs_setup})">${s.needs_setup?'Criar e entrar':'Entrar'}</button><p id="lerr" class="badc" style="margin-top:12px;text-align:center"></p></div></div>`}
async function doLogin(setup){try{const j=await fetch(API+'?r=admin/'+(setup?'setup':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:$('#ln')?.value,email:$('#le').value,senha:$('#lp').value})}).then(r=>r.json());
  if(!j.ok)throw j;JWT=j.token;localStorage.setItem('be_jwt',JWT);boot()}catch(e){$('#lerr').textContent=e.mensagem||'Falha ao entrar'}}

/* ════════ estrutura ════════ */
const TABS=[['dash','home','Início'],['bebidas','beer','Bebidas'],['vendas','bag','Vendas'],['clientes','users','Clientes'],['mais','more','Mais']];
async function boot(){
  try{const m=await api('admin/me');ME=m.user}catch(e){return}
  try{CAT=await api('admin/catalog');PONTOS=CAT.locations}catch(e){PONTOS=[]}
  if(PONTO&&!PONTOS.some(p=>p.id==PONTO))PONTO='';
  document.body.className='';
  $('#root').innerHTML=`<aside class="side"><div class="brand">🍺 Beer <b>Express</b></div>${TABS.map(([k,i,t])=>`<button data-p="${k}" onclick="nav('${k}')">${ic(i)}${t}</button>`).join('')}
     <div class="foot">${esc(ME.nome)}<br><small>${ME.role==='dono'?'Dono de quiosque':ME.role==='operador'?'Operador':'Administrador'}</small></div></aside>
   <header class="top"><div class="wrap"><div class="brand">🍺<span class="bt">Beer <b>Express</b></span></div>
     <button class="pill" onclick="escolherPonto()" ${PONTOS.length<2?'disabled':''}>${ic('store')}<span id="pontoTxt"></span>${PONTOS.length>1?`<svg class="i" style="width:16px;height:16px;color:var(--mut)"><use href="#i-caret"/></svg>`:''}</button>
     <button class="sq" onclick="nav('mais')" title="${esc(ME.nome)}">${esc((ME.nome||'?').trim()[0].toUpperCase())}</button></div></header>
   <main class="wrap" id="main"></main>
   <nav class="tabs" aria-label="Seções">${`<div class="wrap">${TABS.map(([k,i,t])=>`<button class="tab ${k==='bebidas'?'star':''}" data-p="${k}" onclick="nav('${k}')">${ic(i)}${t}</button>`).join('')}</div>`}</nav>`;
  pontoTxt();
  const h=location.hash.slice(1);nav(PG[h]?h:'bebidas');
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PG[h]&&h!==PAGE&&ME)nav(h)});
function pontoTxt(){const p=PONTOS.find(x=>x.id==PONTO);$('#pontoTxt').textContent=p?p.nome:(PONTOS.length===1?PONTOS[0].nome:PONTOS.length?'Todos os pontos':'Nenhum ponto ainda')}
function escolherPonto(){openM(sh('Qual quiosque?')+`<div class="hub">${[{id:'',nome:'Todos os pontos'},...PONTOS].map(p=>`<button onclick="PONTO='${p.id}';localStorage.setItem('be_ponto',PONTO);pontoTxt();closeM();nav(PAGE)"><span class="ic">${p.id?'🍺':'🏪'}</span><span class="grow"><b>${esc(p.nome)}</b></span>${String(PONTO)===String(p.id)?ic('check'):''}</button>`).join('')}</div>`)}
const PG={};
function nav(p){if(!PG[p])p='bebidas';PAGE=p;clearInterval(TIMER);if(location.hash.slice(1)!==p)history.replaceState(null,'','#'+p);
  document.querySelectorAll('[data-p]').forEach(b=>{if(b.dataset.p===p)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  window.scrollTo(0,0);$('#main').innerHTML='<div class="empty"><div class="e">⏳</div>Carregando…</div>';
  PG[p]().catch(e=>{if(e&&e.erro==='auth')return;$('#main').innerHTML=`<div class="empty"><div class="e">⚠️</div>${esc(e.mensagem||e)}<br><button class="btn o" style="margin-top:14px" onclick="nav(PAGE)">Tentar de novo</button></div>`})}

/* ════════ BEBIDAS — editar foto, nome, tipo, teor, tamanhos e preços de cada torneira ════════ */
const ESTILOS=['Pilsen','Lager','Puro Malte','IPA','APA','Session IPA','Weiss','Witbier','Red Ale','Stout','Porter','Sour','Vinho','Sem álcool'];
const CORES=[['#F2D46B','Clara'],['#F2B705','Dourada'],['#D9861C','Âmbar'],['#B5541C','Cobre'],['#8E2B1E','Vermelha'],['#4A2511','Escura'],['#1C0F08','Preta'],['#9B1B48','Vinho']];
PG.bebidas=async function(){
  BEB=await api('admin/bebidas');
  const ts=BEB.torneiras.filter(t=>!PONTO||t.location_id==PONTO), porPonto={};
  ts.forEach(t=>(porPonto[t.loc]=porPonto[t.loc]||[]).push(t));
  const podeCriar=BEB.controladores.some(d=>(!PONTO||d.location_id==PONTO)&&d.canais_usados.length<(d.tipo==='torneira'?1:4));
  $('#main').innerHTML=`<div class="ph1"><h1>Suas bebidas<p>Toque numa torneira para trocar foto, nome, tipo, teor alcoólico, tamanhos e preços.</p></h1></div>
   ${BEB.happy_hour&&BEB.happy_hour.ativo?`<div class="note info">🎉 ${esc(BEB.happy_hour.nome)} agora: preços −${Math.round(BEB.happy_hour.pct)}% na maquininha até ${esc(BEB.happy_hour.ate)}.</div>`:''}
   ${ts.length?Object.entries(porPonto).map(([loc,l])=>`${Object.keys(porPonto).length>1||!PONTO?`<div class="sech">🏪 ${esc(loc)}<span class="mut">${l.length} torneira${l.length>1?'s':''}</span></div>`:''}<div class="taps">${l.map(tapCard).join('')}</div>`).join('')
     :`<div class="box empty"><div class="e">🍺</div><b style="color:var(--h)">Nenhuma torneira ${PONTO?'neste ponto':'ainda'}</b><p style="margin-top:6px">${BEB.controladores.length?'Toque em "Nova torneira" para cadastrar a primeira bebida.':ADMIN()?'Cadastre primeiro o ponto e a chopeira (controlador) em Mais → Equipamentos.':'Peça ao administrador para ligar a sua chopeira ao seu quiosque.'}</p></div>`}
   <div style="height:70px"></div>
   ${podeCriar?`<button class="fab" onclick="editar(0)">${ic('plus')} Nova torneira</button>`:''}`;
};
function fotoHtml(p,w){return p&&p.imagem_url?`<img src="${esc(p.imagem_url)}" alt="" loading="lazy">`:`<div class="cup" style="--c:${esc(p?.cor||'#F5B301')}${w?`;width:${w}px;height:${Math.round(w*1.28)}px`:''}"></div>`}
function tapCard(t){const p=t.produto, pct=t.barril_ml?Math.round(100*t.restante_ml/t.barril_ml):0, ofs=t.ofertas.filter(o=>+o.ativo);
  return `<button class="tapc ${+t.ativo&&p&&+p.ativo?'':'off'}" onclick="editar(${t.id})">
   <div class="ft">${fotoHtml(p)}<span class="num">${String(t.canal).padStart(2,'0')}</span></div>
   <div style="min-width:0;padding-right:36px"><h3>${esc(p?p.nome:'Sem bebida')}</h3>
    <div class="s">${esc(t.nome)} • ${p?esc([p.estilo,p.abv!==null&&p.abv!==undefined?num(+p.abv)+'%':''].filter(Boolean).join(' • ')||'complete os dados'):'toque para escolher'}</div>
    <div class="szs">${ofs.map(o=>`<span>${mlf(o.volume_ml)} • ${brl(o.preco)}</span>`).join('')||'<span style="color:var(--bad)">sem preço</span>'}</div>
    <div class="kg"><span class="dot ${t.online?'':'off'}"></span><div class="meter"><i class="${pct<=t.alerta_pct?'low':pct<35?'mid':''}" style="width:${pct}%"></i></div>${mlf(t.restante_ml)}</div>
    ${!+t.ativo?'<div class="s" style="margin-top:6px;color:var(--warn);font-weight:700">Escondida da maquininha</div>':t.vendidos_hoje?`<div class="s" style="margin-top:6px">🔥 ${t.vendidos_hoje} copo${t.vendidos_hoje>1?'s':''} hoje</div>`:''}
   </div><span class="ed">${ic('edit')}</span></button>`}

let E=null; // bebida em edição
function editar(tapId){
  const t=tapId?BEB.torneiras.find(x=>x.id===tapId):null;
  const devs=BEB.controladores.filter(d=>(!PONTO||d.location_id==PONTO)&&d.canais_usados.length<(d.tipo==='torneira'?1:4));
  const p=t&&t.produto?t.produto:{id:0,nome:'',cervejaria:'',estilo:'',descricao:'',abv:'',ibu:'',cor:'#F2B705',imagem_url:'',ativo:1};
  E={tap:t, prod:{...p, abv:p.abv??'', ibu:p.ibu??''}, ofertas:t?t.ofertas.filter(o=>+o.ativo).map(o=>({...o})):[{id:0,volume_ml:300,preco:''},{id:0,volume_ml:500,preco:''}],
     foto:null, remover:false, ativo:t?+t.ativo:1, barril:t?t.barril_ml:30000, trocou:false, device_id:devs[0]?.id||0, canal:0};
  if(!t&&!devs.length)return toast('Todas as chopeiras deste ponto já têm torneiras cadastradas',true);
  if(!t)E.canal=canalLivre(E.device_id);
  renderEditor();
}
function canalLivre(did){const d=BEB.controladores.find(x=>x.id==did);if(!d)return 1;for(let c=1;c<=(d.tipo==='torneira'?1:4);c++)if(!d.canais_usados.includes(c))return c;return 1}
function renderEditor(){
  const t=E.tap, p=E.prod, devs=BEB.controladores.filter(d=>(!PONTO||d.location_id==PONTO)&&(t||d.canais_usados.length<(d.tipo==='torneira'?1:4)));
  const outro=p.estilo&&!ESTILOS.includes(p.estilo);
  const aviso=t&&t.produto&&p.id===t.produto.id?(ME.role==='dono'&&!t.produto.exclusivo?`<div class="note">Esta bebida também está em outro ponto. Ao salvar, criamos uma cópia só sua — os outros quiosques não mudam.</div>`
     :t.produto.torneiras>1?`<div class="note info">Esta bebida está em ${t.produto.torneiras} torneiras. A mudança vale para todas elas.</div>`:''):'';
  openM(sh(t?esc(t.nome):'Nova torneira',t?esc(t.loc)+' • '+esc(t.device_nome):'Escolha a chopeira e cadastre a bebida')+`
   <div class="prev" id="pv"></div>
   ${aviso}

function renderEstilos(){const p=E.prod,outro=p.estilo&&!ESTILOS.includes(p.estilo);document.querySelectorAll('#estilos button').forEach((b,i)=>b.setAttribute('aria-pressed',i<ESTILOS.length?p.estilo===ESTILOS[i]:outro));

function renderCores(){document.querySelectorAll('#cores .sw').forEach(b=>b.tagName==='BUTTON'&&b.setAttribute('aria-pressed',b.title&&CORES.find(c=>c[1]===b.title)[0]===(E.prod.cor||'').toUpperCase()));pv()}
function renderBarril(){document.querySelectorAll('#barris button').forEach((b,i)=>b.setAttribute('aria-pressed',i<4?[10000,20000,30000,50000][i]===E.barril:![10000,20000,30000,50000].includes(E.barril)));
  const o=document.querySelectorAll('#barris button')[4];o.textContent=![10000,20000,30000,50000].includes(E.barril)?mlf(E.barril):'Outro'}
function passo(k,d){const id=k==='abv'?'#fAbv':'#fIbu';let v=parseFloat(String(E.prod[k]||'').replace(',','.'));if(isNaN(v))v=k==='abv'?4.5:20;v=Math.max(0,Math.round((v+d)*10)/10);if(k==='ibu')v=Math.round(v);
  E.prod[k]=v;$(id).value=num(v);pv()}
function renderSz(){const base=E.ofertas.filter(o=>+o.volume_ml&&+String(o.preco).replace(',','.')).sort((a,b)=>a.volume_ml-b.volume_ml)[0];
  $('#szs').innerHTML=E.ofertas.map((o,i)=>{const pr=+String(o.preco).replace(',','.'),ml=+o.volume_ml;let h='';
    if(pr&&ml){h=`${brl(pr*1000/ml)} por litro`;if(base&&ml>base.volume_ml){const e=Math.round((1-(pr/ml)/(+String(base.preco).replace(',','.')/base.volume_ml))*100);if(e>=5)h+=` • economia de ${e}% (aparece na maquininha)`}}
    return `<div class="szr"><div class="in"><input inputmode="numeric" value="${o.volume_ml||''}" placeholder="300" oninput="E.ofertas[${i}].volume_ml=+this.value.replace(/\\D/g,'');pv();renderSzHint()" aria-label="Volume em ml"><em>ml</em></div>
     <div class="in"><em>R$&nbsp;</em><input inputmode="decimal" value="${o.preco===''?'':num((+String(o.preco).replace(',','.')).toFixed(2))}" placeholder="0,00" oninput="E.ofertas[${i}].preco=this.value.replace(',','.');pv();renderSzHint()" aria-label="Preço"></div>
     <button type="button" class="del" onclick="E.ofertas.splice(${i},1);renderSz();pv()" aria-label="Remover tamanho">${ic('trash')}</button><div class="hint" data-h="${i}">${h}</div></div>`}).join('')||'<p class="mut" style="margin-bottom:10px">Nenhum tamanho. Adicione pelo menos um abaixo.</p>'}
function renderSzHint(){clearTimeout(renderSzHint._t);renderSzHint._t=setTimeout(()=>{const a=document.activeElement,i=[...document.querySelectorAll('#szs input')].indexOf(a),pos=a&&a.selectionStart;renderSz();
  if(i>=0){const n=document.querySelectorAll('#szs input')[i];n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},700)}
function addSz(v){if(v&&E.ofertas.some(o=>+o.volume_ml===v))return toast('Esse tamanho já está na lista',true);E.ofertas.push({id:0,volume_ml:v||'',preco:''});E.ofertas.sort((a,b)=>(+a.volume_ml||9999)-(+b.volume_ml||9999));renderSz();pv();
  const i=E.ofertas.findIndex(o=>+o.volume_ml===v||(!v&&!o.volume_ml));setTimeout(()=>document.querySelectorAll('#szs .szr')[i]?.querySelectorAll('input')[v?1:0].focus(),50)}

function foto(inp){const f=inp.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);

async function salvarBebida(){const p=E.prod;
  if(!String(p.nome||'').trim()){toast('Dê um nome para o chopp',true);return $('#fNome').focus()}
  const ofs=E.ofertas.filter(o=>o.volume_ml||o.preco);
  for(const o of ofs){if(!(+o.volume_ml>=50))return toast('Confira o volume (ml) dos tamanhos',true);if(!(+String(o.preco).replace(',','.')>0))return toast(`Coloque o preço do copo de ${mlf(o.volume_ml)}`,true)}
  if(!ofs.length)return toast('Cadastre pelo menos um tamanho com preço',true);
  const b=$('#bSalvar');b.disabled=true;b.textContent='Salvando…';
  try{const body={tap_id:E.tap?E.tap.id:0,device_id:E.device_id,canal:E.canal,ativo:E.ativo,barril_ml:E.barril,trocou_barril:E.trocou?1:0,
      produto:{id:p.id||0,nome:p.nome,cervejaria:p.cervejaria,estilo:(p.estilo||'').trim(),descricao:p.descricao,abv:p.abv,ibu:p.ibu,cor:p.cor,ativo:1},
      ofertas:ofs.map(o=>({id:o.id||0,volume_ml:+o.volume_ml,preco:String(o.preco).replace(',','.')})),foto:E.foto||'',remover_foto:E.remover?1:0};
    if($('#fTn'))body.nome_torneira=$('#fTn').value;
    await api('admin/bebida_salvar',body);closeM();toast('✅ Salvo! A maquininha atualiza em até 30 segundos.');PG.bebidas()}
  catch(e){toast(e.mensagem||'Não foi possível salvar',true);b.disabled=false;b.innerHTML=ic('check')+' Salvar'}}
async function removerTorneira(id){if(!confirm('Remover esta torneira? (se já vendeu, ela só é escondida)'))return;try{const r=await api('admin/torneira_remover',{tap_id:id});closeM();toast(r.mensagem);PG.bebidas()}catch(e){toast(e.mensagem,true)}}
async function testar(id){const v=prompt('Liberar quantos ml? (teste/cortesia — R$ 0,00)','200');if(!v)return;const m=prompt('Motivo:','teste')||'teste';

  torneiras:[['nome','Nome (ex.: Torneira 1)'],['device_id','Controlador','dev'],['canal','Canal no ESP32 (1-4)','num'],['modo','Modo de liberação','sel',[['flow','Válvula solenoide + fluxômetro (recomendado)'],['pulse','Pulsos para controladora externa']]],['pulsos_por_litro','Pulsos por litro (fluxômetro)','num'],['ml_por_pulso','ml por pulso (modo pulso)','num'],['preco_litro','Beer Pass: preço por litro (R$) — vazio = só copo','num'],['max_ml_servida','Beer Pass: máximo por servida (ml)','num'],['alerta_pct','Alerta de barril baixo (%)','num'],['ativo','Ativa','bool']],
  cupons:[['codigo','Código (ex.: BEER10)'],['descricao','Descrição'],['tipo','Tipo','sel',[['percentual','% de desconto'],['valor','R$ de desconto']]],['valor','Valor do desconto','num'],['minimo','Compra mínima (R$)','num'],['validade','Válido até','date'],['usos_max','Máximo de usos (vazio = ilimitado)','num'],['ativo','Ativo','bool']]};
PG.equip=async function(){CAT=await api('admin/catalog');PONTOS=CAT.locations;const c=CAT,adm=ADMIN(),f=x=>!PONTO||x.location_id==PONTO;
  const devN=id=>c.devices.find(d=>d.id==id), locN=id=>c.locations.find(l=>l.id==id)?.nome||'—';
  const tabs=[['torneiras','Torneiras'],['terminais','Maquininhas'],...(adm?[['devices','Chopeiras (ESP32)'],['locations','Pontos'],['cupons','Cupons']]:[])];
  if(!tabs.some(t=>t[0]===ETAB))ETAB='torneiras';
  let body='';
  if(ETAB==='torneiras')body=c.torneiras.filter(t=>!PONTO||devN(t.device_id)?.location_id==PONTO).map(t=>{const d=devN(t.device_id);return `<div class="it"><span class="ic"><span class="dot ${d?.online?'':'off'}"></span></span><span class="grow"><span class="t">${esc(t.nome)} — ${esc(t.produto||'sem bebida')}</span>
     <div class="s">${esc(d?.nome||'')} • canal ${t.canal} • ${t.modo==='flow'?num(t.pulsos_por_litro)+' pulsos/L':num(t.ml_por_pulso)+' ml/pulso'}${+t.ativo?'':' • inativa'}</div>
     <div class="acts" style="margin-top:8px"><button class="btn o sm" onclick="testar(${t.id})">🔓 Liberar teste</button><button class="btn o sm" onclick="calibrar(${t.id})">🎯 Calibrar</button><button class="btn o sm" onclick="edit('torneiras',${t.id})">${ic('edit')} Técnico</button></div></span></div>`}).join('')
    +`<p class="mut" style="font-size:14px;margin:8px 2px">Foto, nome, tipo, preços e barril ficam na aba <a href="#bebidas">Bebidas</a>.</p>`;
  else{const L=(c[ETAB]||[]).filter(x=>ETAB==='cupons'||ETAB==='locations'?(ETAB!=='locations'||!PONTO||x.id==PONTO):f(x));
    body=L.map(r=>{let t='',s='';
      if(ETAB==='terminais'){t=`<span class="dot ${r.online?'':'off'}"></span>&nbsp; ${esc(r.nome)}`;s=`${esc(locN(r.location_id))} • ${r.tap_id?'presa à '+esc(c.torneiras.find(x=>x.id==r.tap_id)?.nome||'torneira'):'cardápio com todas'} • ${r.provider}<br>Código de pareamento: <code>${esc(r.codigo||'')}</code>${r.serial?' • serial '+esc(r.serial):''}`}
      else if(ETAB==='devices'){t=`<span class="dot ${r.online?'':'off'}"></span>&nbsp; ${esc(r.nome)}`;s=`${esc(locN(r.location_id))} • ${r.tipo==='torneira'?'torneira inteligente':'central'}${r.temperatura!==null?' • 🌡️ '+num(r.temperatura)+'°C':''} • visto ${ago(r.last_seen)}${r.device_key?`<br>Chave: <code>${esc(r.device_key)}</code>`:''}`}
      else if(ETAB==='locations'){t=esc(r.nome);s=`${esc(r.endereco||'')} • TV: <a href="tv.html?loc=${r.id}" target="_blank">tv.html?loc=${r.id}</a>`}
      else {t=`🏷️ ${esc(r.codigo)}`;s=`${r.tipo==='percentual'?(+r.valor)+'%':brl(r.valor)} de desconto${+r.minimo?' • mínimo '+brl(r.minimo):''} • ${r.usos}${r.usos_max?'/'+r.usos_max:''} usos${r.validade?' • até '+r.validade.split('-').reverse().join('/'):''}`}
      return `<button class="it" onclick="edit('${ETAB}',${r.id})"><span class="grow"><span class="t">${t}</span><div class="s">${s}</div>${+r.ativo?'':'<span class="chip">inativo</span>'}</span>${ic('chev')}</button>`}).join('')||'<div class="box empty">Nada cadastrado ainda.</div>';
    if(adm||ETAB!=='terminais')body+=`<button class="btn w full" style="margin-top:6px" onclick="edit('${ETAB}',0)">${ic('plus')} Adicionar</button>`;
    if(ETAB==='terminais')body+=`<p class="mut" style="font-size:14px;margin:10px 2px">No app da maquininha, digite o <b>código de pareamento</b> na primeira abertura. "Cardápio com todas" mostra todas as bebidas do ponto; "presa à torneira" mostra só aquela (igual BeerPass).</p>`;
    if(ETAB==='devices')body+=`<p class="mut" style="font-size:14px;margin:10px 2px">Copie a <b>chave</b> para o portal de configuração do ESP32.</p>`}
  $('#main').innerHTML=`<div class="ph1"><button class="x" style="margin:0" onclick="nav('mais')">‹</button><h1>Equipamentos</h1></div>
   <div class="seg">${tabs.map(([k,t])=>`<button aria-pressed="${ETAB===k}" onclick="ETAB='${k}';PG.equip()">${t}</button>`).join('')}</div>${body}`};
function edit(ent,id){const r=id?CAT[ent].find(x=>x.id==id):{ativo:1,location_id:PONTO||CAT.locations[0]?.id}, fl=FORMS[ent].filter(([k])=>ADMIN()||ent!=='terminais'||!['location_id','provider'].includes(k));
  const inp=([k,l,t,opt])=>{const v=r[k]??'';let h;
    if(t==='bool')return `<label class="tg"><span class="grow"><b>${l}</b></span><input type="checkbox" data-k="${k}" ${+v?'checked':''}><i></i></label>`;
    if(t==='sel')h=`<select data-k="${k}">${opt.map(([a,b])=>`<option value="${a}" ${v==a?'selected':''}>${b}</option>`).join('')}</select>`;
    else if(t==='tap')h=`<select data-k="${k}"><option value="">Cardápio com todas as torneiras do ponto</option>${CAT.torneiras.filter(o=>!r.location_id||CAT.devices.find(d=>d.id==o.device_id)?.location_id==r.location_id).map(o=>`<option value="${o.id}" ${v==o.id?'selected':''}>${esc(o.nome)} — ${esc(o.produto||'')}</option>`).join('')}</select>`;
    else if(t==='date')h=`<input data-k="${k}" type="date" value="${esc(v)}">`;
    else if(t==='loc'||t==='dev'){const L={loc:CAT.locations,dev:CAT.devices}[t];h=`<select data-k="${k}">${L.map(o=>`<option value="${o.id}" ${v==o.id?'selected':''}>${esc(o.nome)}</option>`).join('')}</select>`}
    else h=`<input data-k="${k}" ${t==='num'?'inputmode="decimal"':''} value="${esc(v)}">`;
    return `<label class="field"><span>${l}</span>${h}</label>`};
  openM(sh(id?'Editar':'Adicionar')+fl.map(inp).join('')+`<div class="sbar">${id&&ADMIN()?`<button class="btn d" onclick="salvar('${ent}',${id},true)">${ic('trash')}</button>`:''}<button class="btn o" onclick="closeM()">Cancelar</button><button class="btn w" onclick="salvar('${ent}',${id})">Salvar</button></div>`)}
async function salvar(ent,id,del){if(del&&!confirm('Excluir definitivamente?'))return;const data={id};
  if(del)data._delete=1;else document.querySelectorAll('#sheet [data-k]').forEach(e=>data[e.dataset.k]=e.type==='checkbox'?(e.checked?1:0):e.value.replace(/^(-?\d+),(\d+)$/,'$1.$2'));
  try{await api('admin/save',{entity:ent,data});closeM();toast('Salvo');PG.equip()}catch(e){toast(e.mensagem,true)}}
function calibrar(id){openM(sh('Calibrar torneira')+`<p class="mut" style="margin-bottom:14px">1) Toque em "Liberar teste" com 500 ml num copo medidor.<br>2) Meça o volume real e informe abaixo — o sistema corrige os pulsos.</p>
  <div class="fgrid"><label class="field"><span>Liberado (ml)</span><input id="ce" inputmode="numeric" value="500"></label><label class="field"><span>Medido (ml)</span><input id="cr" inputmode="numeric"></label></div>
  <div class="sbar"><button class="btn o" onclick="closeM()">Cancelar</button><button class="btn w" onclick="doCal(${id})">Aplicar</button></div>`)}
async function doCal(id){try{const r=await api('admin/calibrate',{tap_id:id,ml_esperado:+$('#ce').value,ml_real:+$('#cr').value});closeM();toast(`${r.campo}: ${r.antes} → ${r.depois}`);PG.equip()}catch(e){toast(e.mensagem,true)}}

/* ════════ DONOS E ACESSOS (administrador) ════════ */
PG.usuarios=async function(){const d=await api('admin/usuarios');window._us=d;
  const papel={admin:'Administrador',dono:'Dono de quiosque',operador:'Operador'};
  $('#main').innerHTML=`<div class="ph1"><button class="x" style="margin:0" onclick="nav('mais')">‹</button><h1>Donos e acessos<p>Cada dono entra no painel e vê só os quiosques dele.</p></h1></div>
   ${d.usuarios.map(u=>`<button class="it" onclick="usuario(${u.id})"><span class="ic">${u.role==='dono'?'🍺':'🔑'}</span><span class="grow"><span class="t">${esc(u.nome)}</span><div class="s">${esc(u.email)} • ${papel[u.role]}${u.role==='dono'?' • '+u.pontos.map(p=>esc(d.pontos.find(x=>x.id==p)?.nome||'')).join(', '):''}</div><div class="s">Último acesso: ${dt(u.last_login)}${+u.ativo?'':' • <b class="badc">sem acesso</b>'}</div></span>${ic('chev')}</button>`).join('')}
   <button class="btn w full" style="margin-top:6px" onclick="usuario(0)">${ic('plus')} Novo dono de quiosque</button>`};
function usuario(id){const d=window._us,u=id?d.usuarios.find(x=>x.id===id):{nome:'',email:'',role:'dono',ativo:1,pontos:PONTO?[+PONTO]:[]};
  openM(sh(id?'Editar acesso':'Novo acesso')+`<label class="field"><span>Nome</span><input id="uN" value="${esc(u.nome)}"></label>
   <label class="field"><span>E-mail (login)</span><input id="uE" type="email" inputmode="email" value="${esc(u.email)}"></label>
   <label class="field"><span>${id?'Nova senha <small>(deixe vazio para manter)</small>':'Senha inicial (8+ caracteres)'}</span><input id="uS" type="text" autocomplete="off"></label>
   <div class="field"><span>Tipo de acesso</span><div class="opts" id="uR">${[['dono','Dono de quiosque'],['admin','Administrador'],['operador','Operador']].map(([k,t])=>`<button type="button" data-v="${k}" aria-pressed="${u.role===k}" onclick="document.querySelectorAll('#uR button').forEach(b=>b.setAttribute('aria-pressed',b===this));$('#uP').hidden=this.dataset.v!=='dono'">${t}</button>`).join('')}</div></div>
   <div class="field" id="uP" ${u.role==='dono'?'':'hidden'}><span>Quiosques deste dono</span><div class="opts">${d.pontos.map(p=>`<button type="button" data-p="${p.id}" aria-pressed="${u.pontos.includes(p.id)}" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')">${esc(p.nome)}</button>`).join('')||'<span class="mut">Cadastre os pontos em Equipamentos → Pontos.</span>'}</div></div>
   <label class="tg"><span class="grow"><b>Acesso liberado</b></span><input type="checkbox" id="uA" ${+u.ativo?'checked':''}><i></i></label>
   <div class="sbar"><button class="btn o" onclick="closeM()">Cancelar</button><button class="btn w" onclick="salvarUsuario(${id})">Salvar</button></div>`)}
async function salvarUsuario(id){const role=document.querySelector('#uR [aria-pressed=true]')?.dataset.v||'dono';
  try{await api('admin/usuario_salvar',{id,nome:$('#uN').value,email:$('#uE').value,senha:$('#uS').value,role,ativo:$('#uA').checked?1:0,pontos:[...document.querySelectorAll('#uP [aria-pressed=true]')].map(b=>+b.dataset.p)});
    closeM();toast('Acesso salvo');PG.usuarios()}catch(e){toast(e.mensagem,true)}}

  ${d.leads.map(l=>{const w=String(l.contato).replace(/\D/g,'');return `<div class="it" style="${+l.atendido?'opacity:.55':''}"><span class="grow"><span class="t">${esc(l.nome)}</span><div class="s">${tp[l.tipo]} • ${dt(l.created_at)}${l.cidade?' • '+esc(l.cidade):''}</div>
    <div class="s">${w.length>=10&&!l.contato.includes('@')?`<a href="https://wa.me/55${w.replace(/^55/,'')}" target="_blank">${esc(l.contato)}</a>`:`<a href="mailto:${esc(l.contato)}">${esc(l.contato)}</a>`}</div>${l.mensagem?`<div class="s" style="margin-top:4px">“${esc(l.mensagem)}”</div>`:''}</span>
    <button class="btn o sm" onclick="api('admin/leads&id=${l.id}&atendido=${+l.atendido?0:1}').then(()=>PG.leads())">${+l.atendido?'Reabrir':'✓ Atendido'}</button></div>`}).join('')||'<div class="box empty"><div class="e">📨</div>Nenhum contato ainda.</div>'}`};

PG.config=async function(){const d=await api('admin/settings');SET=d.settings;const s=SET;
  const F=(k,l,t,opt)=>`<label class="field"><span>${l}</span>${t==='sel'?`<select data-s="${k}">${opt.map(([a,b])=>`<option value="${a}" ${s[k]==a?'selected':''}>${b}</option>`).join('')}</select>`:t==='area'?`<textarea data-s="${k}" rows="2">${esc(s[k])}</textarea>`:`<input data-s="${k}" type="${t||'text'}" value="${esc(s[k]??'')}">`}</label>`;
  const yn=[['1','Sim'],['0','Não']];
  $('#main').innerHTML=`<div class="ph1"><button class="x" style="margin:0" onclick="nav('mais')">‹</button><h1>Configurações</h1><button class="btn w sm" onclick="salvarCfg()">Salvar</button></div>
  <div class="box"><h2>🍺 Marca e textos</h2><div class="fgrid r1">${F('marca_nome','Nome')}${F('marca_slogan','Slogan')}${F('marca_cor','Cor principal','color')}${F('cupons_ativo','Cupons de desconto','sel',yn)}</div>
   ${F('termos_texto','Tela ATENÇÃO (termos + 18 anos)','area')}${F('ajuda_texto','Botão "Preciso de ajuda" (vazio = esconde)','area')}${F('msg_final','Mensagem ao final','area')}</div>
  <div class="box"><h2>🔞 Verificação de idade</h2><div class="fgrid r1">${F('verificacao_idade','Como verificar','sel',[['cpf','CPF + nascimento (mais seguro)'],['declaracao','Só "Sim, concordo" (igual BeerPass)']])}${F('idade_minima','Idade mínima','number')}${F('cpf_provider','Conferência na Receita','sel',[['local','Só dígitos + idade declarada'],['nfeio','NFE.io (CPF + nascimento → nome)'],['serpro','Serpro (Consulta CPF)']])}
   ${F('nome_regra','Conferência do nome','sel',[['primeiro_e_sobrenome','Primeiro nome + 1 sobrenome'],['primeiro','Só o primeiro nome']])}${F('reverificar_dias','Reconsultar a Receita a cada (dias)','number')}
   ${F('max_falhas_verificacao','Tentativas até bloquear','number')}${F('bloqueio_minutos','Minutos de bloqueio','number')}${F('falha_api_permite_local','Se a API cair, vender só com dígitos?','sel',[['0','Não (mais seguro)'],['1','Sim']])}</div>
   ${F('nfeio_api_key','Chave API NFE.io','password')}<div class="fgrid r1">${F('serpro_consumer_key','Serpro Consumer Key')}${F('serpro_consumer_secret','Serpro Consumer Secret','password')}</div>${F('serpro_url','URL Serpro (use {cpf}, {nasc} ou {nasc_dmy})')}</div>
  <div class="box"><h2>🎉 Happy Hour automático</h2><div class="fgrid">${F('happy_hour_ativo','Ativo','sel',yn)}${F('happy_hour_nome','Nome da promoção')}${F('happy_hour_inicio','Início','time')}${F('happy_hour_fim','Fim','time')}${F('happy_hour_pct','Desconto (%)','number')}${F('happy_hour_dias','Dias (1=seg … 7=dom)')}</div>
   <p class="mut" style="font-size:14px">No horário, os preços caem sozinhos e a maquininha e a TV mostram o preço cheio riscado.</p></div>
  <div class="box"><h2>🛒 Experiência de compra</h2><div class="fgrid">${F('avaliacao_ativa','Pedir avaliação','sel',yn)}${F('inatividade_s','"Ainda está aí?" após (s)','number')}${F('prova_social_min','"X copos hoje" a partir de','number')}${F('limite_copos_pedido','Máx. copos por compra','number')}${F('limite_ml_dia_cpf','Limite por CPF/dia (ml, 0 = sem)','number')}</div></div>
  <div class="box"><h2>💳 Pagamento (Pix e conferência)</h2>${F('mp_access_token','Mercado Pago — Access Token de produção','password')}<div class="fgrid r1">${F('pix_modo','Pix','sel',[['maquininha','Na própria maquininha (PagBank)'],['api_mp','QR gerado pelo servidor (Mercado Pago)']])}${F('pix_expira_min','Validade do Pix (min)','number')}${F('mp_verificar_cartao','Conferir cartão na API do MP','sel',yn)}</div>${F('pix_email_padrao','E-mail do pagador padrão (Pix)')}
   <p class="mut" style="font-size:14px">Webhook do Mercado Pago (evento Pagamentos):<br><code>${esc(d.webhooks.mercadopago)}</code></p></div>
  <div class="box"><h2>📲 Telegram</h2>${F('telegram_token','Token do bot (@BotFather)','password')}${F('telegram_chat_ids','Chat IDs (separados por vírgula)')}
   <div class="fgrid">${F('tg_notificar_vendas','Avisar cada venda','sel',yn)}${F('tg_notificar_tentativa_menor','Avisar tentativa de menor','sel',yn)}${F('tg_resumo_diario','Resumo diário 23:55','sel',yn)}${F('offline_minutos','Offline após (min)','number')}</div>

   <p class="mut" style="font-size:14px">Os pontos aparecem no mapa pelo cadastro em Equipamentos → Pontos (latitude/longitude). O cardápio do portal vem das torneiras.</p></div>
  <div class="box"><h2>🎫 Beer Pass (recarga + cartão) <span class="chip">desligado por padrão</span></h2><div class="fgrid">${F('pass_ativo','Ativo','sel',yn)}${F('recarga_valores','Valores de recarga (R$)')}${F('recarga_bonus','Bônus (100:5,150:10)')}${F('pass_ml_minimo','Saldo mínimo (ml)','number')}${F('pass_fim_inatividade_s','Fecha após (s) sem fluxo','number')}${F('tv_ranking','Ranking na TV','sel',[['0','Não'],['1','Sim']])}</div>${F('tv_mensagem','Mensagem da TV (BeerList)','area')}</div>
  <button class="btn w full" style="margin:14px 0 24px" onclick="salvarCfg()">Salvar configurações</button>`};
async function salvarCfg(silent){const st={};document.querySelectorAll('[data-s]').forEach(e=>st[e.dataset.s]=e.value);try{await api('admin/settings_save',{settings:st});if(!silent)toast('Configurações salvas');SETPASS=st.pass_ativo==='1';return true}catch(e){toast(e.mensagem,true)}}
async function tgTest(){if(!await salvarCfg(true))return;try{const r=await api('admin/telegram_test',{registrar_webhook:1});toast(r.mensagem+(r.webhook?' • comandos ativos':''))}catch(e){toast(e.mensagem||'Falhou',true)}}
